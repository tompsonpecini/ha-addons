name: Transcrição (Whisper)
version: "1.0.0"
slug: transcricao_whisper
description: Transcreve áudios (ex.: do WhatsApp) com o Whisper rodando localmente, por uma API HTTP simples
url: https://github.com/tompsonpecini/ha-addons/tree/main/transcricao_whisper
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
ports:
  8000/tcp: 8087
ports_description:
  8000/tcp: API de transcrição (POST /transcrever)
options:
  chave: ""
  modelo: small
  idioma: pt
  threads: 4
schema:
  chave: password
  modelo: list(tiny|base|small|medium)
  idioma: str
  threads: int(1,16)
